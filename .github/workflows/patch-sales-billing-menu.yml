name: Patch Sales Billing Menu

on:
  push:
    paths:
      - '.github/workflows/patch-sales-billing-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate Sales & Billing in Control Center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/admin/AdminControlCenterV3.tsx')
          s = p.read_text()

          s = s.replace(
              '  RefreshCw,\n  ScanLine,',
              '  RefreshCw,\n  ReceiptText,\n  ScanLine,'
          )
          s = s.replace(
              'import MigaduCredentialModal from "./MigaduCredentialModal";\n',
              'import MigaduCredentialModal from "./MigaduCredentialModal";\nimport { BillingDashboardCards } from "./SalesBillingModules";\n'
          )

          needle = '''          </nav>\n          <div className="mt-auto rounded-xl border border-white/10 bg-white/5 p-3 text-xs text-slate-400">'''
          replacement = '''            <div className="my-3 border-t border-white/10 pt-3">\n              <div className="mb-2 px-3 text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500">Sales & Billing</div>\n              <a\n                href="/admin/billing"\n                className="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm text-slate-300 transition hover:bg-white/10 hover:text-white"\n              >\n                <ReceiptText size={17} /> Offertes & facturen\n              </a>\n            </div>\n          </nav>\n          <div className="mt-auto rounded-xl border border-white/10 bg-white/5 p-3 text-xs text-slate-400">'''
          if needle not in s:
              raise SystemExit('Sidebar insertion point not found')
          s = s.replace(needle, replacement, 1)

          needle2 = '''      </section>\n      <div className="grid gap-6 xl:grid-cols-[1.3fr_1fr]">'''
          replacement2 = '''      </section>\n      <BillingDashboardCards />\n      <div className="grid gap-6 xl:grid-cols-[1.3fr_1fr]">'''
          if needle2 not in s:
              raise SystemExit('Dashboard insertion point not found')
          s = s.replace(needle2, replacement2, 1)

          p.write_text(s)
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/AdminControlCenterV3.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(admin): expose Sales & Billing in Control Center"
          git push
