name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (informational during migration)
        continue-on-error: true
        run: bun run lint

      - name: Performance integration checks
        run: bun scripts/check-performance-integrations.mjs

      - name: Marketing consent checks
        run: bun scripts/check-marketing-consent.mjs

      - name: Production build
        run: bun run build

