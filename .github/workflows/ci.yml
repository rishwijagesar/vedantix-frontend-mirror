name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (informational during migration)
        continue-on-error: true
        run: bun run lint

      - name: Performance integration checks
        run: bun scripts/check-performance-integrations.mjs

      - name: Marketing consent checks
        run: bun scripts/check-marketing-consent.mjs

      - name: Audit funnel privacy checks
        run: bun scripts/check-audit-funnel.mjs

      - name: Audit funnel admin access checks
        run: bun scripts/check-audit-funnel-admin.mjs

      - name: Lead pipeline checks
        run: bun scripts/check-lead-pipeline.mjs

      - name: PageSpeed integration checks
        run: bun scripts/check-pagespeed-integration.mjs

      - name: Billing first-customer checks
        run: bun scripts/check-billing-first-customer.mjs

      - name: Production build
        run: bun run build
