name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      administration-test-db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: administration-ci-only
          POSTGRES_DB: administration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (informational during migration)
        continue-on-error: true
        run: bun run lint

      - name: Performance integration checks
        run: bun scripts/check-performance-integrations.mjs

      - name: Marketing consent checks
        run: bun scripts/check-marketing-consent.mjs

      - name: Audit funnel privacy checks
        run: bun scripts/check-audit-funnel.mjs

      - name: Audit funnel admin access checks
        run: bun scripts/check-audit-funnel-admin.mjs

      - name: Lead pipeline checks
        run: bun scripts/check-lead-pipeline.mjs

      - name: PageSpeed integration checks
        run: bun scripts/check-pagespeed-integration.mjs

      - name: Billing first-customer checks
        run: bun scripts/check-billing-first-customer.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Invoice payment and PDF regression tests
        run: deno test --node-modules-dir=auto --no-check --allow-env --allow-write=tmp/invoice-payment supabase/functions/_tests/invoice-payment.test.ts supabase/functions/_tests/billing-documents.test.ts -- --preview

      - name: Invoice print preview regression tests
        run: bun test scripts/invoice-payment.test.ts

      - name: Verify QR in rendered PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils zbar-tools > /dev/null
          pdftoppm -png -r 110 -singlefile tmp/invoice-payment/invoice-payment.pdf tmp/invoice-payment/invoice-payment
          test "$(zbarimg --quiet --raw tmp/invoice-payment/invoice-payment.png)" = "https://vedantix.nl/factuur/00000000-0000-4000-8000-000000000001#betalen"

      - name: Verify invoice delivery date and VAT rate in actual PDFs
        run: python3 scripts/check-invoice-tax-fields.py

      - name: Verify document bundle and exact terms text
        run: |
          unzip -t tmp/invoice-payment/documents/dossier.zip
          pdftotext tmp/invoice-payment/documents/voorwaarden.pdf tmp/invoice-payment/documents/voorwaarden.txt
          pdftotext tmp/invoice-payment/documents/concept-contract.pdf tmp/invoice-payment/documents/concept-contract.txt
          bun scripts/check-document-previews.ts
          pdftoppm -png -r 85 -singlefile tmp/invoice-payment/documents/voorwaarden.pdf tmp/invoice-payment/documents/voorwaarden
          pdftoppm -png -r 85 -singlefile tmp/invoice-payment/documents/concept-contract.pdf tmp/invoice-payment/documents/concept-contract

      - uses: actions/upload-artifact@v4
        with:
          name: invoice-payment-preview
          path: tmp/invoice-payment/*

      - name: Public catalog and client case regression tests
        run: bun test scripts/public-content.test.tsx

      - name: Contract prefill regression tests
        run: bun test scripts/contract-prefill.test.ts

      - name: e-Boekhouden setup security and API tests
        run: bun test scripts/ebookhouden.test.ts

      - name: Administration quarter, financial and archive tests
        run: bun test scripts/administration.test.ts

      - name: Administration database authorization and validation
        env:
          PGPASSWORD: administration-ci-only
        run: psql -h localhost -U postgres -d administration_test -v ON_ERROR_STOP=1 -f scripts/administration-db.test.sql

      - name: Migadu mailbox management API and authorization tests
        run: bun test scripts/migadu-management.test.ts

      - name: Migadu Vault isolation and audit authorization
        env:
          PGPASSWORD: administration-ci-only
        run: |
          createdb -h localhost -U postgres migadu_test
          psql -h localhost -U postgres -d migadu_test -v ON_ERROR_STOP=1 -f scripts/migadu-management-db.test.sql

      - name: Mail DNS authorization and conflict regression tests
        run: |
          python3 -m pip install boto3
          python3 -m unittest discover -s aws/mail-dns -p 'test_*.py' -v

      - name: Production build
        run: bun run build

