name: Patch Credit Reference
on:
  push:
    paths: ['.github/workflows/patch-credit-reference.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/admin/sales-billing-data.ts'); s=p.read_text(); s=s.replace('  invoice_id: string;\n  customer_id: string;','  invoice_id: string;\n  invoice_number: string | null;\n  customer_id: string;',1); p.write_text(s)
          p=Path('src/admin/billing-document.ts'); s=p.read_text(); s=s.replace('esc((document as CreditNote).invoice_id)', 'esc((document as CreditNote).invoice_number || "oorspronkelijke factuur")'); p.write_text(s)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin/sales-billing-data.ts src/admin/billing-document.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): reference original invoice on credit note"
          git push
