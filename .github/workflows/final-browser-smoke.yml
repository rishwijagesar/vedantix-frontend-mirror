name: Final Browser Smoke

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-browser-smoke.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Compare rendered production and Lovable DOM
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');
          const PROD='https://vedantix.nl';
          const LOVABLE='https://vedantix-migration-test.lovable.app';
          const routes=['/','/prijzen','/resultaten','/contact','/faq','/online-groei-audit','/ai-vindbaarheid','/blog'];
          const viewports=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];

          async function sig(page){
            return page.evaluate(()=>{
              const css=el=>el?getComputedStyle(el):null;
              const h1=document.querySelector('h1');
              const body=css(document.body);
              const main=document.querySelector('main');
              const text=e=>(e.textContent||'').replace(/\s+/g,' ').trim();
              return {
                title:document.title,
                h1:h1?text(h1):null,
                h1Style:h1?[css(h1).fontSize,css(h1).fontFamily,css(h1).fontWeight,css(h1).letterSpacing,css(h1).lineHeight]:null,
                bodyStyle:[body.fontSize,body.fontFamily,body.backgroundColor,body.color],
                nav:[...document.querySelectorAll('nav a')].map(text).filter(Boolean).slice(0,20),
                headings:[...document.querySelectorAll('h1,h2')].map(text).slice(0,20),
                footerLinks:document.querySelectorAll('footer a').length,
                mainWidth:main?Math.round(main.getBoundingClientRect().width):null,
                scrollHeight:document.documentElement.scrollHeight,
              };
            });
          }

          (async()=>{
            const browser=await chromium.launch({headless:true});
            let failed=false;
            for(const [vpName,viewport] of viewports){
              const ctx=await browser.newContext({viewport});
              await ctx.route('**/*',route=>{
                const req=route.request();
                const url=req.url();
                const allowed=url.startsWith(PROD)||url.startsWith(LOVABLE);
                if(!allowed && ['image','media','font','stylesheet','script','xhr','fetch'].includes(req.resourceType())) return route.abort();
                route.continue();
              });
              for(const routePath of routes){
                const values={};
                for(const [name,base] of [['prod',PROD],['lovable',LOVABLE]]){
                  const p=await ctx.newPage();
                  const r=await p.goto(base+routePath,{waitUntil:'domcontentloaded',timeout:30000});
                  await p.waitForTimeout(1800);
                  values[name]={status:r?r.status():null,sig:await sig(p)};
                  await p.close();
                }
                const a=values.prod.sig,b=values.lovable.sig;
                const diffs=[];
                for(const f of ['title','h1','h1Style','bodyStyle','nav','headings','footerLinks','mainWidth']){
                  if(JSON.stringify(a[f])!==JSON.stringify(b[f])) diffs.push(`${f}: ${JSON.stringify(a[f])} != ${JSON.stringify(b[f])}`);
                }
                const delta=Math.abs(a.scrollHeight-b.scrollHeight)/Math.max(a.scrollHeight,b.scrollHeight,1);
                if(delta>0.05) diffs.push(`scrollHeight ${a.scrollHeight} != ${b.scrollHeight}`);
                if(values.prod.status!==200||values.lovable.status!==200) diffs.push(`status ${values.prod.status}/${values.lovable.status}`);
                if(diffs.length){
                  failed=true; console.error('PARITY_FAIL',vpName,routePath); diffs.forEach(x=>console.error(' ',x));
                } else console.log('PARITY_OK',vpName,routePath);
              }
              await ctx.close();
            }
            await browser.close();
            if(failed) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF

      - name: Route behavior and public API
        run: |
          check_route() {
            path="$1"; expected="$2"
            actual=$(curl -sS -L -o /dev/null -w '%{url_effective}' "https://vedantix-migration-test.lovable.app$path")
            actual_path=$(node -e 'const u=new URL(process.argv[1]);console.log(u.pathname+u.hash)' "$actual")
            echo "$path => $actual_path"; test "$actual_path" = "$expected"
          }
          check_route /pakketvergelijking '/prijzen#vergelijk'
          check_route /foo/bar/baz '/'
          check_route /login '/'
          check_route /klantenportaal '/'
          check_route /ClientPortal '/'
          check_route /CRM '/'
          check_route /admin '/'

          code=$(curl -sS -o /tmp/pricing -w '%{http_code}' https://vedantix-migration-test.lovable.app/api/pricing)
          echo "pricing=$code"; test "$code" = 200; grep -q STARTER /tmp/pricing
          code=$(curl -sS -o /tmp/preview -w '%{http_code}' https://vedantix-migration-test.lovable.app/api/preview/nonexistent-migration-smoke/html)
          echo "preview=$code"; test "$code" = 404; grep -q 'Preview not found' /tmp/preview
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X OPTIONS https://vedantix-migration-test.lovable.app/api/audit)
          echo "audit_options=$code"; test "$code" = 204
