name: Batch deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/deploy-now

permissions:
  contents: read
  id-token: write

concurrency:
  group: vedantix-production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: vedantix-frontend
  STAGING_FUNCTION: vedantix-web-staging
  PRODUCTION_FUNCTION: vedantix-web-production-private
  STAGING_URL: https://dhnczzdgsgc436kkidetyxg45u0zxukp.lambda-url.eu-west-1.on.aws
  LIVE_URL: https://vedantix.nl
  ASSET_BUCKET: vedantix.nl-bucket
  EXPECTED_PLATFORM: aws-lambda
  EXPECTED_MARKER: VEDANTIX_AWS_SERVERLESS_COMMERCE_READY
  AUDIT_FUNNEL_URL: https://zxnexwqvoznmirajhgxj.supabase.co/functions/v1/audit-funnel
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_QlxkbMaJ9IEBAPr9y0d1HQ_xh8Z6oEu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve latest main commit
        run: |
          set -euo pipefail
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381492205513:role/vedantix-frontend-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Smoke test audit funnel through Supabase
        run: |
          set -u
          funnel_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST \
            -H "Origin: $LIVE_URL" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"event":"SMOKE_TEST"}' \
            "$AUDIT_FUNNEL_URL" || true)"
          echo "Audit funnel Supabase smoke returned HTTP $funnel_code"
          if [ "$funnel_code" != "204" ]; then
            echo "::warning::Audit funnel Supabase smoke returned HTTP $funnel_code. Core site deployment will continue because telemetry is non-critical."
          fi

      - name: Deploy verified mail DNS service
        run: |
          set -euo pipefail
          python3 -m pip install boto3
          python3 -m unittest discover -s aws/mail-dns -p 'test_*.py'
          python3 aws/mail-dns/build.py "$RUNNER_TEMP/mail-dns"
          aws lambda update-function-code --function-name vedantix-mail-dns --zip-file "fileb://$RUNNER_TEMP/mail-dns/function.zip" >/dev/null
          aws lambda wait function-updated --function-name vedantix-mail-dns

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$DEPLOY_SHA"
          docker build --platform linux/amd64 -f Dockerfile.aws -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" "$ECR_REGISTRY/$ECR_REPOSITORY:staging-latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:staging-latest"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"

      - name: Publish immutable assets before changing the application
        run: |
          set -euo pipefail
          previous_image="$(aws lambda get-function --function-name "$PRODUCTION_FUNCTION" --query 'Code.ResolvedImageUri' --output text)"
          docker pull "$previous_image"
          previous_container="$(docker create "$previous_image")"
          current_container="$(docker create "$IMAGE_URI")"
          trap 'docker rm "$previous_container" "$current_container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/vedantix-previous" "$RUNNER_TEMP/vedantix-current"
          docker cp "$previous_container:/app/.output/public/." "$RUNNER_TEMP/vedantix-previous/"
          docker cp "$current_container:/app/.output/public/." "$RUNNER_TEMP/vedantix-current/"
          for release in previous current; do
            test -d "$RUNNER_TEMP/vedantix-$release/assets"
            aws s3 sync "$RUNNER_TEMP/vedantix-$release/assets/" "s3://$ASSET_BUCKET/assets/" \
              --cache-control 'public,max-age=31536000,immutable' --only-show-errors
          done

      - name: Deploy staging Lambda
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "$STAGING_FUNCTION" --image-uri "$IMAGE_URI" >/dev/null
          aws lambda wait function-updated --function-name "$STAGING_FUNCTION"

      - name: Smoke test staging with SigV4
        run: |
          set -euo pipefail
          signed_get() {
            curl --fail --silent --show-error \
              --aws-sigv4 "aws:amz:${AWS_REGION}:lambda" \
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
              -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
              "$1"
          }
          signed_code() {
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --aws-sigv4 "aws:amz:${AWS_REGION}:lambda" \
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
              -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
              "$1"
          }
          marker="$(signed_get "$STAGING_URL/.well-known/vedantix-release.json")"
          echo "$marker" | jq -e --arg p "$EXPECTED_PLATFORM" --arg m "$EXPECTED_MARKER" '.platform == $p and .release_marker == $m' >/dev/null
          for path in / /prijzen /online-groei-audit /admin; do
            code="$(signed_code "$STAGING_URL$path")"
            test "$code" = "200"
          done

      - name: Promote same image to private production Lambda
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "$PRODUCTION_FUNCTION" --image-uri "$IMAGE_URI" >/dev/null
          aws lambda wait function-updated --function-name "$PRODUCTION_FUNCTION"

      - name: Smoke test production through CloudFront
        run: |
          set -euo pipefail
          marker="$(curl --fail --silent --show-error "$LIVE_URL/.well-known/vedantix-release.json")"
          echo "$marker" | jq -e --arg p "$EXPECTED_PLATFORM" --arg m "$EXPECTED_MARKER" '.platform == $p and .release_marker == $m' >/dev/null
          for path in / /prijzen /online-groei-audit /admin; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$LIVE_URL$path")"
            test "$code" = "200"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify every production asset
        run: node scripts/smoke-assets.mjs "$LIVE_URL" "$RUNNER_TEMP/vedantix-current"

      - name: Verify live catalog prices and published client cases
        run: node scripts/smoke-public-content.mjs "$LIVE_URL"

      - name: Verify mailbox management rejects unauthenticated access
        run: node scripts/smoke-migadu-management.mjs

      - name: Verify mail DNS rejects unauthenticated changes
        run: node scripts/smoke-mail-dns.mjs

      - name: Mark successful production image
        run: |
          set -euo pipefail
          docker pull "$IMAGE_URI"
          docker tag "$IMAGE_URI" "$ECR_REGISTRY/$ECR_REPOSITORY:production-latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:production-latest"

