name: Admin Lock Sync

on:
  push:
    branches: [admin-v2]
    paths:
      - package.json
      - .github/workflows/admin-lock-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git diff --cached --quiet || git commit -m "chore(admin): sync bun lockfile"
          git push origin admin-v2
